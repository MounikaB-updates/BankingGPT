{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
  <section class="message" data-testid="{{ code }}">
    <h2>{{ heading }}</h2>
    <p>{{ message }}</p>
    {% if action_url %}
      <a href="{{ action_url }}" role="button">{{ action_label }}</a>
    {% endif %}
  </section>
{% endblock %}
